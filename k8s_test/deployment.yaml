apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    server {
      listen 80;
      root /var/www/html/public;

      location / {
        try_files $uri /index.php$is_args$args;
      }

      location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
      }

      location ~ \.php$ {
        return 404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: symfony-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: symfony-app
  template:
    metadata:
      labels:
        app: symfony-app
    spec:
      initContainers:
        - name: copy-public
          image: registry.example.fr/symfony-app:1.0.0
          command: ["sh", "-c", "cp -r /var/www/html/public/. /shared-public/"]
          volumeMounts:
            - name: public
              mountPath: /shared-public
      containers:
        - name: php
          image: registry.example.fr/symfony-app:1.0.0
          ports:
            - containerPort: 9000
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
          volumeMounts:
            - name: public
              mountPath: /var/www/html/public
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: public
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: symfony-service
spec:
  selector:
    app: symfony-app
  ports:
    - port: 80
      targetPort: 80
