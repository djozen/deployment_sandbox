# Stack de développement pour Linux / macOS (Docker natif) : Apache + PHP 8.5 (FPM/CLI) + MySQL + phpMyAdmin + MailDev + Composer + Node LTS
#
# Variante "classique" de docker-compose.dev.yml (Windows/WSL2) : le projet est monté directement dans les conteneurs
# (bind mount), sans service de synchronisation. Les fichiers générés (vendor/, var/, node_modules/, public/build/)
# sont créés dans le projet avec votre utilisateur, grâce à HOST_UID / HOST_GID.
#
# Une fois : exporter votre UID/GID (ou les mettre dans .env.local / .env) :
#                   export HOST_UID=$(id -u) HOST_GID=$(id -g)
#
# Démarrer :        docker compose -f docker-compose.linux.yml up -d --build
# Composer :        docker compose -f docker-compose.linux.yml run --rm composer install
# Node / npm :      docker compose -f docker-compose.linux.yml run --rm node npm install
#                   docker compose -f docker-compose.linux.yml run --rm node npm run dev
# Console Symfony : docker compose -f docker-compose.linux.yml run --rm php-cli php bin/console cache:clear
#
# Web : http://localhost:8080 | phpMyAdmin : http://localhost:8081 | MailDev : http://localhost:1080

name: dev-linux

x-php-build: &php-build
  context: ./docker
  dockerfile: php/Dockerfile

x-php-env: &php-env
  DATABASE_URL: "mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-app}@mysql:3306/${MYSQL_DATABASE:-coplan_portail}?serverVersion=8.0&charset=utf8mb4"
  MAILER_DSN: "smtp://maildev:1025"

x-host-user: &host-user "${HOST_UID:-1000}:${HOST_GID:-1000}"

services:
  apache:
    build:
      context: ./docker
      dockerfile: apache/Dockerfile
    ports:
      - "${APACHE_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
    depends_on:
      - php-fpm
    restart: unless-stopped

  # Les processus PHP tournent avec votre utilisateur pour pouvoir écrire dans var/ sans problème de droits.
  php-fpm:
    build:
      <<: *php-build
      target: fpm
    user: *host-user
    volumes:
      - .:/var/www/html
    environment: *php-env
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  php-cli:
    build:
      <<: *php-build
      target: cli
    user: *host-user
    volumes:
      - .:/var/www/html
    environment: *php-env
    depends_on:
      mysql:
        condition: service_healthy
    profiles: ["tools"]

  composer:
    build:
      <<: *php-build
      target: cli
    entrypoint: ["composer"]
    user: *host-user
    volumes:
      - .:/var/www/html
      - composer_cache:/tmp/composer/cache
    environment: *php-env
    depends_on:
      mysql:
        condition: service_healthy
    profiles: ["tools"]

  node:
    image: node:lts
    user: *host-user
    working_dir: /var/www/html
    environment:
      npm_config_cache: /tmp/.npm
    volumes:
      - .:/var/www/html
    profiles: ["tools"]

  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-coplan_portail}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mysql
      UPLOAD_LIMIT: 256M
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      - mysql
    restart: unless-stopped

  maildev:
    image: maildev/maildev:latest
    ports:
      - "${MAILDEV_WEB_PORT:-1080}:1080"
      - "${MAILDEV_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

volumes:
  mysql_data:
  composer_cache:
