# Stack de production pour Linux (Ubuntu, Docker natif) : Apache + PHP 8.5 (FPM/CLI) + Composer + Node LTS
#
# Variante "production" de docker-compose.linux.yml : phpMyAdmin et MailDev sont retirés, et le service MySQL
# est commenté (la base de données est fournie en externe via DATABASE_URL).
#
# Une fois : exporter votre UID/GID (ou les mettre dans .env.local / .env) :
#                   export HOST_UID=$(id -u) HOST_GID=$(id -g)
#
# Variables à définir (.env / .env.local ou export) :
#   DATABASE_URL  : URL de la base de données externe
#   MAILER_DSN    : DSN SMTP de production (par défaut : null://null, aucun envoi)
#
# Démarrer :        docker compose -f docker-compose.prod.linux.yml up -d --build
# Composer :        docker compose -f docker-compose.prod.linux.yml run --rm composer install --no-dev --optimize-autoloader
# Node / npm :      docker compose -f docker-compose.prod.linux.yml run --rm node npm ci
#                   docker compose -f docker-compose.prod.linux.yml run --rm node npm run build
# Console Symfony : docker compose -f docker-compose.prod.linux.yml run --rm php-cli php bin/console cache:clear --env=prod
#
# Le code est copié dans l'image php-fpm (cible "prod") : aucun bind mount sur le code applicatif.
# Web (Apache) : http://localhost (APACHE_PORT)
# Alternative nginx : voir le bloc commenté "nginx" plus bas (NGINX_PORT, 8080 par défaut)

name: prod

x-php-build: &php-build
  context: .
  dockerfile: docker/php/Dockerfile

x-php-env: &php-env
  APP_ENV: prod
  DATABASE_URL: "${DATABASE_URL:-mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-app}@mysql:3306/${MYSQL_DATABASE:-coplan_portail}?serverVersion=8.0&charset=utf8mb4}"
  MAILER_DSN: "${MAILER_DSN:-null://null}"

x-host-user: &host-user "${HOST_UID:-1000}:${HOST_GID:-1000}"

services:
  apache:
    build:
      context: .
      dockerfile: docker/apache/Dockerfile.prod
      additional_contexts:
        app: service:php-fpm
    ports:
      - "${APACHE_PORT:-80}:80"
    depends_on:
      - php-fpm
    restart: unless-stopped

  # Alternative nginx (décommenter ce bloc et commenter le service apache ci-dessus) :
  # nginx:
  #   build:
  #     context: .
  #     dockerfile: docker/nginx/Dockerfile
  #     additional_contexts:
  #       app: service:php-fpm
  #   ports:
  #     - "${NGINX_PORT:-8080}:80"
  #   depends_on:
  #     - php-fpm
  #   restart: unless-stopped

  # Code copié dans l'image (cible "prod", sans bind mount) : les processus PHP tournent avec www-data.
  php-fpm:
    build:
      <<: *php-build
      target: prod
      additional_contexts:
        src: .
    environment: *php-env
    # depends_on:
    #   mysql:
    #     condition: service_healthy
    restart: unless-stopped

  php-cli:
    build:
      <<: *php-build
      target: cli
    user: *host-user
    volumes:
      - .:/var/www/html
    environment: *php-env
    # depends_on:
    #   mysql:
    #     condition: service_healthy
    profiles: ["tools"]

  composer:
    build:
      <<: *php-build
      target: cli
    entrypoint: ["composer"]
    user: *host-user
    volumes:
      - .:/var/www/html
      - composer_cache:/tmp/composer/cache
    environment: *php-env
    # depends_on:
    #   mysql:
    #     condition: service_healthy
    profiles: ["tools"]

  node:
    image: node:lts
    user: *host-user
    working_dir: /var/www/html
    environment:
      npm_config_cache: /tmp/.npm
    volumes:
      - .:/var/www/html
    profiles: ["tools"]

  # mysql:
  #   image: mysql:8.0
  #   command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
  #     MYSQL_DATABASE: ${MYSQL_DATABASE:-coplan_portail}
  #     MYSQL_USER: ${MYSQL_USER:-app}
  #     MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
  #   ports:
  #     - "${MYSQL_PORT:-3307}:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 20
  #   restart: unless-stopped

volumes:
  # mysql_data:
  composer_cache:
