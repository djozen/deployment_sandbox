# Stack de développement : Apache + PHP 8.5 (FPM/CLI) + MySQL + phpMyAdmin + MailDev + Composer + Node LTS
#
# Le code reste sous C:\ (WAMP). Le service "sync" le copie (sens unique, toutes les 2 s) vers le volume app_src,
# sur le disque Linux de WSL2, d'où PHP/Apache le lisent rapidement. Modifier le code uniquement sous Windows.
# vendor/ et var/ ne sont pas synchronisés : ils vivent uniquement dans le volume (jamais en commun avec WAMP).
#
# Démarrer :        docker compose -f docker-compose.dev.yml up -d --build
# Composer :        docker compose -f docker-compose.dev.yml run --rm composer install
# Node / npm :      docker compose -f docker-compose.dev.yml run --rm node npm install
#                   docker compose -f docker-compose.dev.yml run --rm node npm run dev
# Console Symfony : docker compose -f docker-compose.dev.yml run --rm php-cli php bin/console cache:clear
#
# Web : http://localhost:8080 | phpMyAdmin : http://localhost:8081 | MailDev : http://localhost:1080

name: windows-dev

x-php-build: &php-build
  context: ./docker
  dockerfile: php/Dockerfile

x-php-env: &php-env
  DATABASE_URL: "mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-app}@mysql:3306/${MYSQL_DATABASE:-coplan_portail}?serverVersion=8.0&charset=utf8mb4"
  MAILER_DSN: "smtp://maildev:1025"

services:
  # Copie le projet Windows (C:\) vers le volume app_src (disque Linux WSL2, rapide) toutes les SYNC_INTERVAL secondes.
  # Sens unique : modifier le code sous Windows, jamais dans le volume.
  sync:
    build:
      context: ./docker
      dockerfile: sync/Dockerfile
    environment:
      SYNC_INTERVAL: ${SYNC_INTERVAL:-2}
    volumes:
      - .:/source:ro
      - app_src:/var/www/html
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/.docker-synced"]
      interval: 3s
      timeout: 3s
      retries: 600
    restart: unless-stopped

  apache:
    build:
      context: ./docker
      dockerfile: apache/Dockerfile
    ports:
      - "${APACHE_PORT:-8080}:80"
    volumes:
      - app_src:/var/www/html:ro
    depends_on:
      sync:
        condition: service_healthy
      php-fpm:
        condition: service_started
    restart: unless-stopped

  php-fpm:
    build:
      <<: *php-build
      target: fpm
    volumes:
      - app_src:/var/www/html
    environment: *php-env
    depends_on:
      sync:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped

  php-cli:
    build:
      <<: *php-build
      target: cli
    user: www-data
    volumes:
      - app_src:/var/www/html
    environment: *php-env
    depends_on:
      sync:
        condition: service_healthy
      mysql:
        condition: service_healthy
    profiles: ["tools"]

  composer:
    build:
      <<: *php-build
      target: cli
    entrypoint: ["composer"]
    user: www-data
    volumes:
      - app_src:/var/www/html
      - composer_cache:/tmp/composer/cache
    environment: *php-env
    depends_on:
      sync:
        condition: service_healthy
      mysql:
        condition: service_healthy
    profiles: ["tools"]

  # Travaille sur le projet Windows : public/build est ensuite synchronisé vers app_src.
  # node_modules reste dans un volume Linux pour ne pas écraser celui de Windows (binaires natifs différents).
  node:
    image: node:lts
    environment:
      - NPM_CONFIG_STRICT_SSL=false # Désactive la vérification stricte SSL pour npm derrière un proxy
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    profiles: ["tools"]

  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-coplan_portail}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mysql
      UPLOAD_LIMIT: 256M
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      - mysql
    restart: unless-stopped

  maildev:
    image: maildev/maildev:latest
    ports:
      - "${MAILDEV_WEB_PORT:-1080}:1080"
      - "${MAILDEV_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

volumes:
  mysql_data:
  composer_cache:
  app_src:
  node_modules:
